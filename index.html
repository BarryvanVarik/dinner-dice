<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dinner Dice</title>
    <meta name="description" content="Roll ingredient dice to decide what to cook for dinner.">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="intro" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">Dinner Dice</p>
          <h1 id="page-title">Roll tonight's ingredients</h1>
          <p class="intro-copy">Let chance pick a protein, carb, vegetable, sauce, and wildcard. Lock anything you like, then roll again.</p>
        </div>
        <div class="dice-mark" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
      </section>

      <section class="controls" aria-label="Roll controls">
        <button class="primary-action" id="rollButton" type="button">
          Roll Dinner
        </button>
        <button class="secondary-action" id="saveButton" type="button">
          Save Combo
        </button>
        <button class="ghost-action" id="clearLocksButton" type="button">
          Clear Locks
        </button>
      </section>

      <section class="diet-row" aria-label="Dinner mode">
        <label class="toggle">
          <input id="vegetarianToggle" type="checkbox">
          <span>Vegetarian</span>
        </label>
        <label class="toggle">
          <input id="quickToggle" type="checkbox">
          <span>Quick dinner</span>
        </label>
      </section>

      <section class="dice-grid" id="diceGrid" aria-live="polite"></section>

      <section class="saved" aria-labelledby="saved-title">
        <div class="section-heading">
          <h2 id="saved-title">Saved combos</h2>
          <button class="text-action" id="clearSavedButton" type="button">Clear</button>
        </div>
        <ul class="saved-list" id="savedList"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
